<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="resq-shield-gradient" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="resq-cross-gradient" x1="30" y1="20" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="resq-soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M50 10 L82 22 C82 52 68 74 50 90 C32 74 18 52 18 22 Z" 
        fill="#f0f7ff" 
        stroke="url(#resq-shield-gradient)" 
        stroke-width="4" 
        stroke-linejoin="round"
        filter="url(#resq-soft-shadow)"/>

  <!-- Emergency Medical Plus Symbol -->
  <path d="M42 28 H58 V42 H72 V58 H58 V72 H42 V58 H28 V42 H42 Z" 
        fill="#ffffff" 
        stroke="#bae6fd" 
        stroke-width="1.5"/>

  <!-- Vital Lifeline / ECG Pulse Arrow crossing horizontally -->
  <path d="M22 50 L38 50 L43 38 L48 62 L53 44 L57 53 L62 50 L78 50" 
        stroke="#0284c7" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Arrow Head on the Right -->
  <path d="M73 45 L80 50 L73 55" 
        fill="none"
        stroke="#0284c7" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Telemetry Dot on the Left -->
  <circle cx="22" cy="50" r="3" fill="#0284c7"/>
</svg>
