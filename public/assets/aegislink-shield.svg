<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aegis-shield-grad" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="aegis-glow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M50 8 L84 22 C84 54 68 76 50 92 C32 76 16 54 16 22 Z" 
        stroke="url(#aegis-shield-grad)" 
        stroke-width="3.5" 
        fill="#080c14" 
        fill-opacity="0.85"
        filter="url(#neon-glow)"/>

  <!-- Inner Mesh Network Facets -->
  <path d="M50 18 L74 30 L64 64 L50 82 L36 64 L26 30 Z" 
        stroke="#38bdf8" 
        stroke-opacity="0.4" 
        stroke-width="1.2" 
        fill="none"/>

  <!-- Network Interconnection Constellation Lines -->
  <line x1="50" y1="18" x2="50" y2="48" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="26" y1="30" x2="50" y2="48" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="74" y1="30" x2="50" y2="48" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="36" y1="64" x2="50" y2="48" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="50" y2="48" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="48" x2="50" y2="82" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="26" y1="30" x2="36" y2="64" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="2 3"/>
  <line x1="74" y1="30" x2="64" y2="64" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="2 3"/>

  <!-- Pulse / ECG Waveform in Center -->
  <path d="M38 48 L44 48 L47 41 L53 55 L56 48 L62 48" 
        stroke="#ffffff" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing Mesh Nodes -->
  <circle cx="50" cy="18" r="3" fill="#ffffff" filter="url(#neon-glow)"/>
  <circle cx="26" cy="30" r="3" fill="#38bdf8"/>
  <circle cx="74" cy="30" r="3" fill="#38bdf8"/>
  <circle cx="50" cy="48" r="4" fill="#ffffff" filter="url(#neon-glow)"/>
  <circle cx="36" cy="64" r="3" fill="#38bdf8"/>
  <circle cx="64" cy="64" r="3" fill="#38bdf8"/>
  <circle cx="50" cy="82" r="3" fill="#ffffff"/>
</svg>
